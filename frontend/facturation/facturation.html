<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facturation - ISTSH SYSTEM</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, Helvetica, sans-serif;}
body{background:#f4f4f4;display:flex;}

/* SIDEBAR */
.sidebar{width:260px;background:#1D1464;height:100vh;color:white;position:fixed;left:0;top:0;padding:20px;}
.sidebar h2{text-align:center;margin-bottom:30px;}
.sidebar a{display:block;padding:12px;color:white;border-radius:6px;margin:5px 0;text-decoration:none;}
.sidebar a:hover{background:#0f0b3b;}

/* TOPBAR */
.topbar{margin-left:260px;width:calc(100% - 260px);background:white;padding:15px 25px;display:flex;justify-content:space-between;align-items:center;position:fixed;top:0;box-shadow:0 2px 5px rgba(0,0,0,0.2);}

/* CONTENT */
.content{margin-left:260px;margin-top:80px;padding:20px;}
h2{margin-bottom:20px;}
.btn{padding:10px 15px;border:none;background:#1D1464;color:white;border-radius:5px;cursor:pointer;margin-right:10px;}
.btn:hover{background:#0f0b3b;}
.form-container{background:white;padding:20px;border-radius:10px;margin-top:20px;box-shadow:0 0 10px rgba(0,0,0,0.1);}
input, select{width:100%;padding:10px;margin:8px 0;border-radius:5px;border:1px solid #bbb;}
label{font-weight:bold;}
table{width:100%;background:white;border-collapse:collapse;margin-top:25px;border-radius:10px;overflow:hidden;}
th, td{padding:12px;border-bottom:1px solid #ddd;text-align:left;cursor:pointer;}
th{background:#1D1464;color:white;}
tr:hover{background:#f1f1f1;}
.action-btn{padding:7px 12px;border:none;color:white;border-radius:5px;cursor:pointer;}
.update{background:orange;}
.delete{background:red;}
.message{display:none;padding:10px;margin:10px 0;border-radius:5px;font-weight:bold;}
.success{background:#d4edda;color:#155724;}
.error{background:#f8d7da;color:#721c24;}
.search-filter{margin:15px 0; display:flex; gap:10px;}
.search-filter input, .search-filter select{width:auto;flex:1;}
</style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>ISTSH SYSTEM</h2>

  <a href="../dashboard.html"><i class="fa fa-home"></i> Tableau de bord</a>
  <a href="../stock/stock.html"><i class="fa fa-box"></i> Gestion Stock</a>
  <a href="../rh/rh.html"><i class="fa fa-users"></i> Ressources Humaines</a>
  <a href="facturation.html"><i class="fa fa-file-invoice"></i> Facturation</a>

  <a href="../scolarité/scolarité.html"><i class="fa fa-graduation-cap"></i> Scolarité</a>
  <a href="../scolarité/liste-etudiants.html"><i class="fa fa-list"></i> Liste Étudiants</a>
  <a href="../facturation/nouvelle-facture.html"><i class="fa fa-user-plus"></i> Ajouter Étudiant</a>

  <a href="../frontend/lagout.html"><i class="fa fa-sign-out"></i> Déconnexion</a>
</div>

<!-- TOPBAR -->
<div class="topbar">
  <h3>Gestion Facturation</h3>
</div>

<!-- CONTENT -->
<div class="content">
  <h2>Liste des factures</h2>

  <!-- Message -->
  <div id="msg" class="message"></div>

  <!-- Boutons -->
  <button class="btn" onclick="showForm()"><i class="fa fa-plus"></i> Ajouter Facture</button>
  <button class="btn" onclick="printTable()"><i class="fa fa-print"></i> Imprimer</button>

  <!-- Recherche et filtre -->
  <div class="search-filter">
    <input type="text" id="searchInput" placeholder="Rechercher par numéro ou client" onkeyup="applyFilters()">
    <select id="filterStatus" onchange="applyFilters()">
      <option value="">Tous statuts</option>
      <option value="Payée">Payée</option>
      <option value="Impayée">Impayée</option>
    </select>
  </div>

  <!-- FORMULAIRE AJOUT/MODIFICATION -->
  <div class="form-container" id="formAdd" style="display:none;">
    <h3>Ajouter / Modifier une facture</h3>
    <label>Numéro facture</label>
    <input type="text" id="numFacture" placeholder="Ex : FACT001">
    <label>Client</label>
    <input type="text" id="client" placeholder="Ex : Jean Mukendi">
    <label>Date</label>
    <input type="date" id="date">
    <label>Montant</label>
    <input type="number" id="montant" placeholder="Ex : 1500">
    <label>Status</label>
    <select id="status">
      <option value="Payée">Payée</option>
      <option value="Impayée">Impayée</option>
    </select>
    <button class="btn" onclick="saveInvoice()">Enregistrer</button>
    <button class="btn" style="background:red;" onclick="hideForm()">Annuler</button>
  </div>

  <!-- TABLEAU -->
  <table id="invoiceTable">
    <thead>
      <tr>
        <th onclick="sortTable(0)">Numéro</th>
        <th onclick="sortTable(1)">Client</th>
        <th onclick="sortTable(2)">Date</th>
        <th onclick="sortTable(3)">Montant</th>
        <th onclick="sortTable(4)">Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

</div>

<script>
let invoices = JSON.parse(localStorage.getItem('invoices')) || [];
let editingIndex = null;

function showMessage(text,type='success'){
    const msg = document.getElementById('msg');
    msg.textContent=text;
    msg.className = `message ${type}`;
    msg.style.display='block';
    setTimeout(()=>{ msg.style.display='none'; },2500);
}

function renderTable(){
    const tbody = document.getElementById('invoiceTable').querySelector('tbody');
    tbody.innerHTML='';
    invoices.forEach((inv,i)=>{
        const tr = tbody.insertRow();
        tr.insertCell(0).innerText=inv.numFacture;
        tr.insertCell(1).innerText=inv.client;
        tr.insertCell(2).innerText=inv.date;
        tr.insertCell(3).innerText=inv.montant;
        tr.insertCell(4).innerText=inv.status;
        const actionCell = tr.insertCell(5);
        actionCell.innerHTML=`<button class="action-btn update" onclick="editInvoice(${i})">Modifier</button>
                              <button class="action-btn delete" onclick="deleteInvoice(${i})">Supprimer</button>`;
    });
    applyFilters();
}

function showForm(){ document.getElementById('formAdd').style.display='block'; clearForm(); }
function hideForm(){ document.getElementById('formAdd').style.display='none'; editingIndex=null; }
function clearForm(){
    document.getElementById('numFacture').value='';
    document.getElementById('client').value='';
    document.getElementById('date').value='';
    document.getElementById('montant').value='';
    document.getElementById('status').value='Payée';
}

function saveInvoice(){
    const numFacture=document.getElementById('numFacture').value.trim();
    const client=document.getElementById('client').value.trim();
    const date=document.getElementById('date').value;
    const montant=document.getElementById('montant').value;
    const status=document.getElementById('status').value;
    if(!numFacture||!client||!date||!montant){ showMessage('Veuillez remplir tous les champs','error'); return; }
    const inv={numFacture,client,date,montant,status};
    if(editingIndex!==null){ invoices[editingIndex]=inv; showMessage('Facture mise à jour'); }
    else{ invoices.push(inv); showMessage('Facture ajoutée'); }
    localStorage.setItem('invoices',JSON.stringify(invoices));
    renderTable(); hideForm();
}

function editInvoice(index){
    editingIndex=index; const inv=invoices[index];
    document.getElementById('numFacture').value=inv.numFacture;
    document.getElementById('client').value=inv.client;
    document.getElementById('date').value=inv.date;
    document.getElementById('montant').value=inv.montant;
    document.getElementById('status').value=inv.status;
    showForm();
}

function deleteInvoice(index){
    if(confirm('Voulez-vous vraiment supprimer cette facture ?')){
        invoices.splice(index,1);
        localStorage.setItem('invoices',JSON.stringify(invoices));
        renderTable();
        showMessage('Facture supprimée');
    }
}

// RECHERCHE + FILTRE combiné
function applyFilters(){
    const query = document.getElementById('searchInput').value.toLowerCase();
    const statusFilter = document.getElementById('filterStatus').value;
    const tbody = document.getElementById('invoiceTable').querySelector('tbody');
    Array.from(tbody.rows).forEach(row=>{
        const num=row.cells[0].innerText.toLowerCase();
        const client=row.cells[1].innerText.toLowerCase();
        const status=row.cells[4].innerText;
        const matchQuery = num.includes(query) || client.includes(query);
        const matchStatus = statusFilter==='' || status===statusFilter;
        row.style.display=(matchQuery && matchStatus)?'':'none';
    });
}

function sortTable(col){
    const keys=['numFacture','client','date','montant','status'];
    invoices.sort((a,b)=>{
        let valA=a[keys[col]]; let valB=b[keys[col]];
        if(col===3) return valA-valB; // montant numérique
        return valA.localeCompare(valB);
    });
    localStorage.setItem('invoices',JSON.stringify(invoices));
    renderTable();
}

function printTable(){
    const table=document.getElementById('invoiceTable');
    const newWin=window.open('','', 'width=900,height=600');
    newWin.document.write('<html><head><title>Impression Factures</title>');
    newWin.document.write('<style>table{width:100%;border-collapse:collapse;font-family:Arial, Helvetica, sans-serif;}th,td{border:1px solid #000;padding:8px;text-align:left;}th{background:#1D1464;color:white;}</style>');
    newWin.document.write('</head><body>');
    newWin.document.write('<h2>Liste des Factures - ISTSH SYSTEM</h2>');
    newWin.document.write(table.outerHTML);
    newWin.document.write('</body></html>');
    newWin.document.close(); newWin.focus(); newWin.print(); newWin.close();
}

// Initialisation
renderTable();
</script>

</body>
</html>
