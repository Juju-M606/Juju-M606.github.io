<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liste du stock - ISTSH SYSTEM</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, Helvetica, sans-serif;}
body{background:#f4f4f4;display:flex;}
.sidebar{width:260px;background:#1D1464;height:100vh;color:white;position:fixed;left:0;top:0;padding:20px;}
.sidebar h2{text-align:center;margin-bottom:30px;}
.sidebar a{display:block;padding:12px;color:white;border-radius:6px;margin:5px 0;text-decoration:none;}
.sidebar a:hover{background:#0f0b3b;}
.topbar{margin-left:260px;width:calc(100% - 260px);background:white;padding:15px 25px;display:flex;justify-content:space-between;align-items:center;position:fixed;top:0;box-shadow:0 2px 5px rgba(0,0,0,0.2);}
.content{margin-left:260px;margin-top:80px;padding:20px;}
h2{margin-bottom:20px;}
table{width:100%;background:white;border-collapse:collapse;margin-top:25px;border-radius:10px;overflow:hidden;}
th, td{padding:12px;border-bottom:1px solid #ddd;text-align:left;cursor:pointer;}
th{background:#1D1464;color:white;}
tr:hover{background:#f1f1f1;}
.message{display:none;padding:10px;margin:10px 0;border-radius:5px;font-weight:bold;}
.success{background:#d4edda;color:#155724;}
.error{background:#f8d7da;color:#721c24;}
.search-filter{margin:15px 0; display:flex; gap:10px;}
.search-filter input, .search-filter select{width:auto;flex:1;}
</style>
</head>
<body>

<div class="sidebar">
  <h2>ISTSH SYSTEM</h2>
  <a href="../dashboard.html"><i class="fa fa-home"></i> Tableau de bord</a>
  <a href="stock.html"><i class="fa fa-box"></i> Gestion Stock</a>
  <a href="../rh/rh.html"><i class="fa fa-users"></i> Ressources Humaines</a>
  <a href="../facturation/facturation.html"><i class="fa fa-file-invoice"></i> Facturation</a>
  <a href="../scolarité/scolarité.html"><i class="fa fa-graduation-cap"></i> Scolarité</a>
  <a href="../frontend/lagout.html"><i class="fa fa-sign-out"></i> Déconnexion</a>
</div>

<div class="topbar"><h3>Liste du stock</h3></div>

<div class="content">
  <h2>Produits en stock</h2>

  <div id="msg" class="message"></div>

  <div class="search-filter">
    <input type="text" id="searchInput" placeholder="Rechercher par nom ou référence" onkeyup="applyFilters()">
    <select id="filterCat" onchange="applyFilters()">
      <option value="">Toutes catégories</option>
      <option value="Informatique">Informatique</option>
      <option value="Bureautique">Bureautique</option>
      <option value="Autre">Autre</option>
    </select>
  </div>

  <table id="stockTable">
    <thead>
      <tr>
        <th onclick="sortTable(0)">Référence</th>
        <th onclick="sortTable(1)">Nom</th>
        <th onclick="sortTable(2)">Catégorie</th>
        <th onclick="sortTable(3)">Quantité</th>
        <th onclick="sortTable(4)">Prix unitaire</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <button class="btn" onclick="printTable()"><i class="fa fa-print"></i> Imprimer</button>
</div>

<script>
let stock = JSON.parse(localStorage.getItem('stock')) || [];

function renderTable(){
    const tbody=document.getElementById('stockTable').querySelector('tbody');
    tbody.innerHTML='';
    stock.forEach(item=>{
        const tr=tbody.insertRow();
        tr.insertCell(0).innerText=item.ref;
        tr.insertCell(1).innerText=item.nom;
        tr.insertCell(2).innerText=item.categorie;
        tr.insertCell(3).innerText=item.quantite;
        tr.insertCell(4).innerText=item.prix;
    });
    applyFilters();
}

function applyFilters(){
    const query=document.getElementById('searchInput').value.toLowerCase();
    const filterCat=document.getElementById('filterCat').value;
    const tbody=document.getElementById('stockTable').querySelector('tbody');
    Array.from(tbody.rows).forEach(row=>{
        const nom=row.cells[1].innerText.toLowerCase();
        const ref=row.cells[0].innerText.toLowerCase();
        const cat=row.cells[2].innerText;
        const matchQuery=nom.includes(query)||ref.includes(query);
        const matchCat=filterCat===''||cat===filterCat;
        row.style.display=(matchQuery && matchCat)?'':'none';
    });
}

function sortTable(col){
    const keys=['ref','nom','categorie','quantite','prix'];
    stock.sort((a,b)=>{
        if(col===3 || col===4) return a[keys[col]]-b[keys[col]];
        return a[keys[col]].localeCompare(b[keys[col]]);
    });
    localStorage.setItem('stock',JSON.stringify(stock));
    renderTable();
}

function printTable(){
    const table=document.getElementById('stockTable');
    const newWin=window.open('','', 'width=900,height=600');
    newWin.document.write('<html><head><title>Impression Stock</title>');
    newWin.document.write('<style>table{width:100%;border-collapse:collapse;font-family:Arial, Helvetica, sans-serif;}th,td{border:1px solid #000;padding:8px;text-align:left;}th{background:#1D1464;color:white;}</style>');
    newWin.document.write('</head><body>');
    newWin.document.write('<h2>Liste du Stock - ISTSH SYSTEM</h2>');
    newWin.document.write(table.outerHTML);
    newWin.document.write('</body></html>');
    newWin.document.close(); newWin.focus(); newWin.print(); newWin.close();
}

renderTable();
</script>

</body>
</html>
