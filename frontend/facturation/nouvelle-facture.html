<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nouvelle Facture - ISTSH SYSTEM</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial, Helvetica, sans-serif;}
    body{background:#f4f4f4;display:flex;}
    /* SIDEBAR */
    .sidebar{width:260px;background:#1D1464;height:100vh;color:white;position:fixed;left:0;top:0;padding:20px;}
    .sidebar h2{text-align:center;margin-bottom:30px;}
    .sidebar a{display:block;padding:12px;color:white;border-radius:6px;margin:5px 0;text-decoration:none;}
    .sidebar a:hover{background:#0f0b3b;}
    /* TOPBAR */
    .topbar{margin-left:260px;width:calc(100% - 260px);background:white;padding:15px 25px;display:flex;justify-content:space-between;align-items:center;position:fixed;top:0;box-shadow:0 2px 5px rgba(0,0,0,0.2);}
    /* CONTENT */
    .content{margin-left:260px;margin-top:80px;padding:20px;}
    .btn{padding:10px 15px;border:none;background:#1D1464;color:white;border-radius:5px;cursor:pointer;margin-right:10px;}
    .btn:hover{background:#0f0b3b;}
    .form-container{background:white;padding:20px;border-radius:10px;margin-top:20px;box-shadow:0 0 10px rgba(0,0,0,0.1);}
    input, select{width:100%;padding:10px;margin:8px 0;border-radius:5px;border:1px solid #bbb;}
    label{font-weight:bold;}
    table{width:100%;background:white;border-collapse:collapse;margin-top:20px;border-radius:10px;overflow:hidden;}
    th, td{padding:12px;border-bottom:1px solid #ddd;text-align:left;}
    th{background:#1D1464;color:white;}
    tr:hover{background:#f1f1f1;}
    .action-btn{padding:5px 10px;border:none;color:white;border-radius:5px;cursor:pointer;}
    .delete{background:red;}
</style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
<h2>ISTSH SYSTEM</h2>
<a href="dashboard.html"><i class="fa fa-home"></i> Tableau de bord</a>
<a href="stock.html"><i class="fa fa-box"></i> Gestion Stock</a>
<a href="rh.html"><i class="fa fa-users"></i> Ressources Humaines</a>
<a href="facturation.html"><i class="fa fa-file-invoice"></i> Facturation</a>
<a href="scolarité.html"><i class="fa fa-graduation-cap"></i> Scolarité</a>
<a href="logout.html"><i class="fa fa-sign-out"></i> Déconnexion</a>
</div>

<!-- TOPBAR -->
<div class="topbar">
<h3>Nouvelle Facture</h3>
</div>

<!-- CONTENT -->
<div class="content">
<div class="form-container">
<h2>Créer une Facture</h2>
<label>Nom du Client</label>
<input type="text" id="client" placeholder="Ex : Mukendi Jean">

<label>Date</label>
<input type="date" id="date">

<h3>Produits</h3>
<table id="productTable">
<thead>
<tr>
<th>Produit</th>
<th>Quantité</th>
<th>Prix Unitaire</th>
<th>Montant</th>
<th>Actions</th>
</tr>
</thead>
<tbody>
<!-- Lignes ajoutées dynamiquement -->
</tbody>
</table>
<button class="btn" onclick="addProductRow()"><i class="fa fa-plus"></i> Ajouter Produit</button>

<h3>Total : <span id="total">0</span> FC</h3>

<button class="btn" onclick="saveInvoice()"><i class="fa fa-save"></i> Enregistrer Facture</button>
<button class="btn" style="background:orange;" onclick="printInvoice()"><i class="fa fa-print"></i> Imprimer</button>
</div>
</div>

<script>
let invoiceProducts = [];

function addProductRow(){
    const tbody = document.getElementById('productTable').getElementsByTagName('tbody')[0];
    const row = tbody.insertRow();
    row.innerHTML = `
        <td><input type="text" placeholder="Produit"></td>
        <td><input type="number" min="1" value="1" oninput="updateRowTotal(this)"></td>
        <td><input type="number" min="0" value="0" oninput="updateRowTotal(this)"></td>
        <td class="rowTotal">0</td>
        <td><button class="action-btn delete" onclick="deleteRow(this)">Supprimer</button></td>
    `;
}

function updateRowTotal(element){
    const row = element.closest('tr');
    const qty = parseFloat(row.cells[1].children[0].value) || 0;
    const price = parseFloat(row.cells[2].children[0].value) || 0;
    row.cells[3].innerText = qty * price;
    updateTotal();
}

function deleteRow(btn){
    const row = btn.closest('tr');
    row.remove();
    updateTotal();
}

function updateTotal(){
    const tbody = document.getElementById('productTable').getElementsByTagName('tbody')[0];
    let total = 0;
    Array.from(tbody.rows).forEach(row => {
        total += parseFloat(row.cells[3].innerText) || 0;
    });
    document.getElementById('total').innerText = total;
}

function saveInvoice(){
    const client = document.getElementById('client').value.trim();
    const date = document.getElementById('date').value;
    const tbody = document.getElementById('productTable').getElementsByTagName('tbody')[0];

    if(!client || !date || tbody.rows.length === 0){
        alert('Veuillez remplir tous les champs et ajouter au moins un produit');
        return;
    }

    const products = [];
    Array.from(tbody.rows).forEach(row => {
        const produit = row.cells[0].children[0].value.trim();
        const quantite = parseFloat(row.cells[1].children[0].value);
        const prix = parseFloat(row.cells[2].children[0].value);
        if(produit && quantite && prix){
            products.push({produit, quantite, prix, montant: quantite*prix});
        }
    });

    const invoice = {client, date, products, total: parseFloat(document.getElementById('total').innerText)};
    let invoices = JSON.parse(localStorage.getItem('invoices')) || [];
    invoices.push(invoice);
    localStorage.setItem('invoices', JSON.stringify(invoices));
    alert('Facture enregistrée !');
    location.reload();
}

function printInvoice(){
    const client = document.getElementById('client').value;
    const date = document.getElementById('date').value;
    const tbody = document.getElementById('productTable').getElementsByTagName('tbody')[0];

    let printWindow = window.open('', '', 'width=800,height=600');
    printWindow.document.write('<html><head><title>Facture</title>');
    printWindow.document.write('<style>table{width:100%;border-collapse:collapse;}th,td{border:1px solid #000;padding:8px;}th{background:#1D1464;color:white;}</style>');
    printWindow.document.write('</head><body>');
    printWindow.document.write('<h2>Facture</h2>');
    printWindow.document.write('<p>Client: ' + client + '</p>');
    printWindow.document.write('<p>Date: ' + date + '</p>');
    printWindow.document.write('<table><tr><th>Produit</th><th>Quantité</th><th>Prix</th><th>Montant</th></tr>');

    Array.from(tbody.rows).forEach(row => {
        printWindow.document.write('<tr>');
        for(let i=0;i<4;i++){
            printWindow.document.write('<td>' + row.cells[i].innerText + '</td>');
        }
        printWindow.document.write('</tr>');
    });

    printWindow.document.write('</table>');
    printWindow.document.write('<h3>Total : ' + document.getElementById('total').innerText + ' FC</h3>');
    printWindow.document.write('</body></html>');
    printWindow.document.close();
    printWindow.print();
}
</script>

</body>
</html>
