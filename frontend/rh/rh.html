<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ressources Humaines - ISTSH SYSTEM</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, Helvetica, sans-serif;}
body{background:#f4f4f4;display:flex;}

/* SIDEBAR */
.sidebar{width:260px;background:#1D1464;height:100vh;color:white;position:fixed;left:0;top:0;padding:20px;}
.sidebar h2{text-align:center;margin-bottom:30px;}
.sidebar a{display:block;padding:12px;color:white;border-radius:6px;margin:5px 0;text-decoration:none;}
.sidebar a:hover{background:#0f0b3b;}

/* TOPBAR */
.topbar{margin-left:260px;width:calc(100% - 260px);background:white;padding:15px 25px;display:flex;justify-content:space-between;align-items:center;position:fixed;top:0;box-shadow:0 2px 5px rgba(0,0,0,0.2);}

/* CONTENT */
.content{margin-left:260px;margin-top:80px;padding:20px;}
h2{margin-bottom:20px;}
.btn{padding:10px 15px;border:none;background:#1D1464;color:white;border-radius:5px;cursor:pointer;margin-right:10px;}
.btn:hover{background:#0f0b3b;}
.form-container{background:white;padding:20px;border-radius:10px;margin-top:20px;box-shadow:0 0 10px rgba(0,0,0,0.1);}
input, select{width:100%;padding:10px;margin:8px 0;border-radius:5px;border:1px solid #bbb;}
label{font-weight:bold;}
table{width:100%;background:white;border-collapse:collapse;margin-top:25px;border-radius:10px;overflow:hidden;}
th, td{padding:12px;border-bottom:1px solid #ddd;text-align:left;cursor:pointer;}
th{background:#1D1464;color:white;}
tr:hover{background:#f1f1f1;}
.action-btn{padding:7px 12px;border:none;color:white;border-radius:5px;cursor:pointer;}
.update{background:orange;}
.delete{background:red;}
.message{display:none;padding:10px;margin:10px 0;border-radius:5px;font-weight:bold;}
.success{background:#d4edda;color:#155724;}
.error{background:#f8d7da;color:#721c24;}
.search-filter{margin:15px 0; display:flex; gap:10px;}
.search-filter input, .search-filter select{width:auto;flex:1;}
</style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>ISTSH SYSTEM</h2>

  <a href="../dashboard.html"><i class="fa fa-home"></i> Tableau de bord</a>
  <a href="../stock/stock.html"><i class="fa fa-box"></i> Gestion Stock</a>
  <a href="rh.html"><i class="fa fa-users"></i> Ressources Humaines</a>
  <a href="../facturation/facturation.html"><i class="fa fa-file-invoice"></i> Facturation</a>

  <a href="../scolarité/scolarité.html"><i class="fa fa-graduation-cap"></i> Scolarité</a>
  <a href="../scolarité/liste-etudiants.html"><i class="fa fa-list"></i> Liste Étudiants</a>
  <a href="../scolarité/ajouter-etudiant.html"><i class="fa fa-user-plus"></i> Ajouter Étudiant</a>

  <a href="../frontend/lagout.html"><i class="fa fa-sign-out"></i> Déconnexion</a>
</div>

<!-- TOPBAR -->
<div class="topbar">
  <h3>Ressources Humaines</h3>
</div>

<!-- CONTENT -->
<div class="content">
  <h2>Liste des employés</h2>

  <!-- Message -->
  <div id="msg" class="message"></div>

  <!-- Boutons -->
  <button class="btn" onclick="showForm()"><i class="fa fa-plus"></i> Ajouter Employé</button>
  <button class="btn" onclick="printTable()"><i class="fa fa-print"></i> Imprimer</button>

  <!-- Recherche et filtre -->
  <div class="search-filter">
    <input type="text" id="searchInput" placeholder="Rechercher par nom, poste ou téléphone" onkeyup="applyFilters()">
    <select id="filterStatus" onchange="applyFilters()">
      <option value="">Tous statuts</option>
      <option value="Actif">Actif</option>
      <option value="Inactif">Inactif</option>
    </select>
  </div>

  <!-- FORMULAIRE AJOUT/MODIFICATION -->
  <div class="form-container" id="formAdd" style="display:none;">
    <h3>Ajouter / Modifier un employé</h3>
    <label>Nom</label>
    <input type="text" id="nom" placeholder="Ex : Mukendi">
    <label>Prénom</label>
    <input type="text" id="prenom" placeholder="Ex : Jean">
    <label>Téléphone</label>
    <input type="text" id="tel" placeholder="Ex : 0999999999">
    <label>Poste</label>
    <input type="text" id="poste" placeholder="Ex : Comptable">
    <label>Status</label>
    <select id="status">
      <option value="Actif">Actif</option>
      <option value="Inactif">Inactif</option>
    </select>
    <button class="btn" onclick="saveEmployee()">Enregistrer</button>
    <button class="btn" style="background:red;" onclick="hideForm()">Annuler</button>
  </div>

  <!-- TABLEAU -->
  <table id="employeeTable">
    <thead>
      <tr>
        <th onclick="sortTable(0)">Nom</th>
        <th onclick="sortTable(1)">Prénom</th>
        <th onclick="sortTable(2)">Téléphone</th>
        <th onclick="sortTable(3)">Poste</th>
        <th onclick="sortTable(4)">Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

</div>

<script>
let employees = JSON.parse(localStorage.getItem('employees')) || [];
let editingIndex = null;

function showMessage(text,type='success'){
    const msg = document.getElementById('msg');
    msg.textContent=text;
    msg.className = `message ${type}`;
    msg.style.display='block';
    setTimeout(()=>{ msg.style.display='none'; },2500);
}

function renderTable(){
    const tbody = document.getElementById('employeeTable').querySelector('tbody');
    tbody.innerHTML='';
    employees.forEach((e,i)=>{
        const tr = tbody.insertRow();
        tr.insertCell(0).innerText=e.nom;
        tr.insertCell(1).innerText=e.prenom;
        tr.insertCell(2).innerText=e.tel;
        tr.insertCell(3).innerText=e.poste;
        tr.insertCell(4).innerText=e.status;
        const actionCell = tr.insertCell(5);
        actionCell.innerHTML=`<button class="action-btn update" onclick="editEmployee(${i})">Modifier</button>
                              <button class="action-btn delete" onclick="deleteEmployee(${i})">Supprimer</button>`;
    });
    applyFilters();
}

function showForm(){ document.getElementById('formAdd').style.display='block'; clearForm(); }
function hideForm(){ document.getElementById('formAdd').style.display='none'; editingIndex=null; }
function clearForm(){
    document.getElementById('nom').value='';
    document.getElementById('prenom').value='';
    document.getElementById('tel').value='';
    document.getElementById('poste').value='';
    document.getElementById('status').value='Actif';
}

function saveEmployee(){
    const nom=document.getElementById('nom').value.trim();
    const prenom=document.getElementById('prenom').value.trim();
    const tel=document.getElementById('tel').value.trim();
    const poste=document.getElementById('poste').value.trim();
    const status=document.getElementById('status').value;
    if(!nom||!prenom||!tel||!poste){ showMessage('Veuillez remplir tous les champs','error'); return; }
    const emp={nom,prenom,tel,poste,status};
    if(editingIndex!==null){ employees[editingIndex]=emp; showMessage('Employé mis à jour'); }
    else{ employees.push(emp); showMessage('Employé ajouté'); }
    localStorage.setItem('employees',JSON.stringify(employees));
    renderTable(); hideForm();
}

function editEmployee(index){
    editingIndex=index; const e=employees[index];
    document.getElementById('nom').value=e.nom;
    document.getElementById('prenom').value=e.prenom;
    document.getElementById('tel').value=e.tel;
    document.getElementById('poste').value=e.poste;
    document.getElementById('status').value=e.status;
    showForm();
}

function deleteEmployee(index){
    if(confirm('Voulez-vous vraiment supprimer cet employé ?')){
        employees.splice(index,1);
        localStorage.setItem('employees',JSON.stringify(employees));
        renderTable();
        showMessage('Employé supprimé');
    }
}

// RECHERCHE + FILTRE combiné
function applyFilters(){
    const query = document.getElementById('searchInput').value.toLowerCase();
    const statusFilter = document.getElementById('filterStatus').value;
    const tbody = document.getElementById('employeeTable').querySelector('tbody');
    Array.from(tbody.rows).forEach(row=>{
        const nom=row.cells[0].innerText.toLowerCase();
        const prenom=row.cells[1].innerText.toLowerCase();
        const tel=row.cells[2].innerText.toLowerCase();
        const poste=row.cells[3].innerText.toLowerCase();
        const status=row.cells[4].innerText;
        const matchQuery = nom.includes(query) || prenom.includes(query) || tel.includes(query) || poste.includes(query);
        const matchStatus = statusFilter==='' || status===statusFilter;
        row.style.display=(matchQuery && matchStatus)?'':'none';
    });
}

function sortTable(col){
    const keys=['nom','prenom','tel','poste','status'];
    employees.sort((a,b)=>{
        let valA=a[keys[col]]; let valB=b[keys[col]];
        return valA.localeCompare(valB);
    });
    localStorage.setItem('employees',JSON.stringify(employees));
    renderTable();
}

function printTable(){
    const table=document.getElementById('employeeTable');
    const newWin=window.open('','', 'width=800,height=600');
    newWin.document.write('<html><head><title>Impression RH</title>');
    newWin.document.write('<style>table{width:100%;border-collapse:collapse;font-family:Arial, Helvetica, sans-serif;}th,td{border:1px solid #000;padding:8px;text-align:left;}th{background:#1D1464;color:white;}</style>');
    newWin.document.write('</head><body>');
    newWin.document.write('<h2>Liste des Employés - ISTSH SYSTEM</h2>');
    newWin.document.write(table.outerHTML);
    newWin.document.write('</body></html>');
    newWin.document.close(); newWin.focus(); newWin.print(); newWin.close();
}

// Initialisation
renderTable();
</script>

</body>
</html>
